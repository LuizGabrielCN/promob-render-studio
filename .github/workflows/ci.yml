name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.19"
      - run: uv sync --project backend --python 3.11 --locked
      - name: Baixar arquivos do tokenizador CLIP
        run: >-
          uv run --project backend --locked hf download emilianJR/epiCRealism
          tokenizer/vocab.json tokenizer/merges.txt
          tokenizer/tokenizer_config.json tokenizer/special_tokens_map.json
      - run: uv run --project backend --locked python -m pytest -c backend/pyproject.toml tests/unit tests/integration
        env:
          HF_HUB_OFFLINE: "1"

  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
