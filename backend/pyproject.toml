[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promob-render-enhancer-backend"
version = "0.1.0"
description = "Professional architectural render enhancement engine for Promob"
requires-python = ">=3.11, <3.13"
license = { text = "MIT" }
authors = [
    { name = "ArchRender Studio Team" }
]
dependencies = [
    # Núcleo: modo Clássico, prévia, ampliação 4× (ONNX) e download de modelos.
    # O instalador do Windows embute somente estas dependências.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0,<3.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "onnxruntime-directml>=1.18.0; sys_platform == 'win32'",
    "onnxruntime>=1.18.0; sys_platform != 'win32'",
    "python-multipart>=0.0.9",
    "psutil>=5.9.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-directml>=1.18.0; sys_platform == 'win32'",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[dependency-groups]
# Realismo IA (PyTorch CUDA, diffusers etc.). Instalado por padrão no `uv sync`
# e sob demanda pelo aplicativo instalado no Windows.
ai = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "diffusers>=0.30.0",
    "transformers>=0.44.0",
    "accelerate>=0.33.0",
    "safetensors>=0.4.4",
    "einops>=0.8.0",
    "rapidocr-onnxruntime>=1.4.4",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["../tests", "tests"]
pythonpath = [".", "app", "../backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
markers = [
    "gpu: requires local CUDA GPU + SD 1.5 / ControlNet weights",
    "slow: long-running 4K tiled upscale or multi-scene workload",
    "relighting: requires M2 architectural relighting leap (R1 spot cones, fireplace flames, dL_low dynamics)",
    "browser: requires built frontend/dist and headless Chrome/Edge CDP",
    "offline: launches isolated OfflineAuditedServer with TCP socket audit",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv]
default-groups = ["dev", "ai"]
override-dependencies = [
    "onnxruntime>=1.18.0; sys_platform != 'win32'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]
